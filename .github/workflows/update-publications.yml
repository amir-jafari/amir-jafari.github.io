name: Update Publications from Google Scholar

on:
  push:
    branches: [main, master]
    paths:
      - "data/publications.json"   # also re-sync when you edit the JSON manually
  schedule:
    - cron: "0 6 * * 1"           # every Monday at 06:00 UTC
  workflow_dispatch:               # allow manual trigger from GitHub Actions UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install scholarly

      - name: Fetch & merge publications
        run: python scripts/update_publications.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/publications.json
          if git diff --cached --quiet; then
            echo "No new publications found."
          else
            git commit -m "chore: sync publications from Google Scholar [skip ci]"
            git push
          fi