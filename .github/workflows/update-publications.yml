name: Update Publications from Google Scholar

on:
  push:
    branches: [main, master]
    paths:
      - "data/publications.json"   # also re-sync when you edit the JSON manually
  schedule:
    - cron: "0 6 * * 1"           # every Monday at 06:00 UTC
  workflow_dispatch:               # allow manual trigger from GitHub Actions UI

jobs:
  update:
    # For push events: skip if the bot made the push (prevents infinite loop).
    # Schedule and workflow_dispatch always run regardless of last committer.
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    # Google Scholar blocks GitHub-hosted runners' datacenter IPs, so this runs
    # on a self-hosted runner on a home/office machine (residential IP). If the
    # runner is offline, the job just queues until it comes back.
    runs-on: [self-hosted, Windows]
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      # Standard library only - uses whatever Python is on the runner's PATH.
      - name: Fetch & merge publications
        run: python scripts/update_publications.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Commit if changed
        shell: powershell
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/publications.json data/publications.js index.html
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            "No new publications found."
          } else {
            git commit -m "chore: sync publications from Google Scholar"
            git push
          }
