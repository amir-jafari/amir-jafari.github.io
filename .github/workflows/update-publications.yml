name: Update Publications from Google Scholar

on:
  push:
    branches: [main, master]
    paths:
      - "data/publications.json"   # also re-sync when you edit the JSON manually
  schedule:
    - cron: "0 6 * * 1"           # every Monday at 06:00 UTC
  workflow_dispatch:               # allow manual trigger from GitHub Actions UI

jobs:
  update:
    # Skip if the push was made by the bot itself (prevents infinite loop)
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install scholarly free-proxy

      - name: Fetch & merge publications
        run: python scripts/update_publications.py
        env:
          # Optional: add SCRAPER_API_KEY as a repo secret for more reliable access
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/publications.json data/publications.js index.html
          if git diff --cached --quiet; then
            echo "No new publications found."
          else
            git commit -m "chore: sync publications from Google Scholar"
            git push
          fi